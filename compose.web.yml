services:
  awc-radio-web:
    build:
      context: .
      dockerfile: web/Dockerfile
    container_name: awc-radio-web
    ports:
      - "8088:8088"
    volumes:
      # Change this to the actual host folder containing audio.rpf.
      - /mnt/nas-downloads/GTA6:/game:ro
      - ./awc-web-cache:/cache
    environment:
      TZ: Asia/Singapore
      GAME_DIR: /game
      APPDATA: /cache
      RADIO_AUTH_USER: ${RADIO_AUTH_USER:-awcradio}
      RADIO_AUTH_PASSWORD: ${RADIO_AUTH_PASSWORD:-}
      RADIO_SESSION_SECRET: ${RADIO_SESSION_SECRET:-}
      RADIO_LOCAL_HOST: ${RADIO_LOCAL_HOST:-192.168.8.8:8088}
    restart: unless-stopped
